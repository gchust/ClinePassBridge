name: Sync upstream releases

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'gchust/ClinePassBridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - name: Mirror upstream and create or update its sync PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: bash .github/scripts/upstream-sync.sh
