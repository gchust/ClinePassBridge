name: Release fork after custom merge

on:
  # Only closed, merged PRs are eligible; checkout never uses an unmerged PR head.
  # This also provides publish permissions after merging an external contributor PR.
  pull_request_target:
    branches: [custom/main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of an already merged PR into custom/main
        type: string
        required: true

permissions:
  contents: write
  pull-requests: read

# Serialize retries for the same PR; distinct PRs allocate tags atomically.
# A global concurrency group would discard pending releases on rapid merges.
concurrency:
  group: fork-release-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'gchust/ClinePassBridge' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      base_tag: ${{ steps.version.outputs.base_tag }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/main
          fetch-depth: 0
      - name: Verify merged PR and reserve an idempotent fork tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python3 .github/scripts/fork_release.py prepare \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
          - runner: macos-15
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Stamp fork version and marketplace metadata in the build workspace
        env:
          FORK_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 .github/scripts/fork_release.py stamp \
            --tag "$FORK_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Test and package native macOS library
        env:
          GOARCH: ${{ matrix.goarch }}
          FORK_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash .github/scripts/build-macos.sh "$FORK_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.goarch }}
          path: |
            dist/clinepassbridge_*.zip
            dist/registry.json
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-darwin-*
          merge-multiple: true
          path: dist
      - name: Verify packages and publish the fork release
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_TAG: ${{ needs.prepare.outputs.tag }}
          FORK_VERSION: ${{ needs.prepare.outputs.version }}
          BASE_TAG: ${{ needs.prepare.outputs.base_tag }}
          MERGE_SHA: ${{ needs.prepare.outputs.commit }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -name '*.zip' | wc -l | tr -d ' ')" = 2
          for arch in amd64 arm64; do
            archive="clinepassbridge_${FORK_VERSION}_darwin_${arch}.zip"
            test "$(unzip -Z1 "$archive")" = clinepassbridge.dylib
          done
          jq -e --arg version "$FORK_VERSION" --arg repo "https://github.com/$GITHUB_REPOSITORY" \
            '.plugins[0].version == $version and .plugins[0].repository == $repo' registry.json
          sha256sum clinepassbridge_*.zip > checksums.txt
          sha256sum -c checksums.txt
          cat > release-notes.md <<EOF
          Fork release: $FORK_TAG
          Upstream base: $BASE_TAG (xiao-qiu-qiu/ClinePassBridge)
          Source merge commit: $MERGE_SHA
          Merged PR: #$PR_NUMBER

          Built from custom/main for macOS amd64 and arm64. Each ZIP contains
          clinepassbridge.dylib at its root, with SHA-256 values in checksums.txt.
          The library and attached registry.json use version $FORK_VERSION.
          Registry source: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/registry.json
          EOF
          if ! gh release view "$FORK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$FORK_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "$FORK_TAG" --notes-file release-notes.md
          fi
          gh release upload "$FORK_TAG" clinepassbridge_*.zip checksums.txt registry.json \
            --clobber --repo "$GITHUB_REPOSITORY"
          release_id="$(gh release view "$FORK_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --method PATCH \
            -F draft=false -F prerelease=false -f make_latest=legacy --silent
          printf 'Published `%s` from `%s` (upstream `%s`).\n' \
            "$FORK_TAG" "$MERGE_SHA" "$BASE_TAG" >> "$GITHUB_STEP_SUMMARY"
